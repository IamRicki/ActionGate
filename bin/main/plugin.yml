name: ActionGate
version: 1.0.0
main: me.andia.actiongate.ActionGatePlugin
api-version: '26.2'
description: Configurable gameplay restrictions powered by Bukkit permissions.
commands:
  actiongate:
    description: View and administer ActionGate.
    usage: /actiongate
    aliases: [ag]
    permission: actiongate.admin
permissions:
  actiongate.admin:
    description: Allows use of ActionGate administration commands and GUI.
    default: op
  actiongate.bypass:
    description: Bypasses every ActionGate gameplay restriction.
    default: false
